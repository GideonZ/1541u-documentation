  /v1/drives/{drive}:mount:
    put:
      summary: Mount disk image from filesystem
      parameters:
        - in: path
          name: drive
          required: true
          schema:
            type: string
        - in: query
          name: image
          required: true
          schema:
            type: string
        - in: query
          name: type
          schema:
            type: string
            enum: [d64, g64, d71, g71, d81]
        - in: query
          name: mode
          schema:
            type: string
            enum: [readwrite, readonly, unlinked]
      responses:
        "200":
          description: Mount complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: Mount uploaded disk image
      parameters:
        - in: path
          name: drive
          required: true
          schema:
            type: string
        - in: query
          name: type
          schema:
            type: string
            enum: [d64, g64, d71, g71, d81]
        - in: query
          name: mode
          schema:
            type: string
            enum: [readwrite, readonly, unlinked]
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Mount complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
